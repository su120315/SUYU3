<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="在线编程编辑器 - 边学边练，实时运行HTML/CSS/JavaScript代码">
  <meta name="keywords" content="在线编程,代码编辑器,HTML,CSS,JavaScript,实时预览">
  <title>在线编程 | 蘇魚编程教学</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.460.0"></script>
  <style>
:root {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f5f9;
  --bg-code: #1e1e2e;
  --accent-primary: #6366f1;
  --accent-secondary: #22d3ee;
  --accent-tertiary: #f472b6;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --border-color: #e2e8f0;
  --gradient: linear-gradient(135deg, #6366f1, #22d3ee, #f472b6);
  --gradient-short: linear-gradient(135deg, #6366f1, #22d3ee);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
  --font-heading: 'Space Grotesk', 'Noto Sans SC', sans-serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
}
.dark-mode {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-tertiary: #1a1a24;
  --bg-code: #161620;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border-color: #2a2a3a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.7;
  overflow: hidden;
  height: 100vh;
}

/* ===== 导航栏 ===== */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  padding: 12px 0;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-color);
  height: 56px;
}
.dark-mode .navbar { background: rgba(10,10,15,0.85); }
.nav-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 100%;
  padding: 0 20px;
  margin: 0 auto;
}
.nav-logo {
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 700;
  background: var(--gradient-short);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  cursor: pointer;
  text-decoration: none;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 20px;
  list-style: none;
}
.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: color 0.2s;
  cursor: pointer;
}
.nav-links a:hover { color: var(--accent-primary); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.back-main {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--gradient-short);
  color: white !important;
  border-radius: 20px;
  font-size: 13px !important;
  text-decoration: none;
}
.theme-toggle {
  width: 36px; height: 36px;
  border: none;
  background: var(--bg-tertiary);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.theme-toggle:hover { background: var(--border-color); }
.nav-toggle { display: none; }

/* ===== 主布局 ===== */
.main-layout {
  display: grid;
  grid-template-columns: 320px 1fr 1fr;
  height: calc(100vh - 56px);
  margin-top: 56px;
  gap: 0;
}

/* ===== 左侧课程面板 ===== */
.course-panel {
  border-right: 1px solid var(--border-color);
  background: var(--bg-secondary);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.panel-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
}
.panel-close {
  width: 28px; height: 28px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.panel-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.course-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.course-content h3 {
  font-size: 18px;
  margin-bottom: 12px;
  color: var(--text-primary);
}
.course-content p {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 12px;
  white-space: pre-line;
}
.course-content .code-block {
  background: var(--bg-code);
  border-radius: 8px;
  overflow: hidden;
  margin: 12px 0;
}
.course-content .code-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.course-content .code-lang {
  color: #94a3b8;
  font-size: 12px;
  font-family: var(--font-mono);
}
.course-content .code-load-btn {
  background: var(--accent-primary);
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}
.course-content pre {
  padding: 14px;
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.6;
  color: #e2e8f0;
  font-family: var(--font-mono);
}
.course-content code { font-family: var(--font-mono); }
.empty-lesson {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  text-align: center;
  padding: 40px;
}
.empty-lesson-icon { font-size: 48px; margin-bottom: 16px; }
.empty-lesson p { font-size: 14px; }

/* ===== 中间编辑器面板 ===== */
.editor-panel {
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  overflow: hidden;
}
.editor-tabs {
  display: flex;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-color);
  padding: 0 8px;
}
.editor-tab {
  padding: 10px 20px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  font-family: var(--font-mono);
}
.editor-tab:hover { color: var(--text-primary); }
.editor-tab.active {
  color: var(--accent-primary);
  border-bottom-color: var(--accent-primary);
  background: var(--bg-secondary);
}
.editor-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.editor-area {
  width: 100%;
  height: 100%;
  resize: none;
  border: none;
  outline: none;
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.6;
  background: var(--bg-code);
  color: #e2e8f0;
  tab-size: 2;
  display: none;
}
.editor-area.active { display: block; }
.editor-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--border-color);
}
.toolbar-left { display: flex; gap: 8px; }
.toolbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--border-color);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.toolbar-btn:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
}
.run-btn {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: white;
}
.run-btn:hover {
  background: #4f46e5;
  color: white;
}

/* ===== 右侧预览面板 ===== */
.preview-panel {
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  overflow: hidden;
}
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-color);
}
.preview-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-actions { display: flex; gap: 8px; }
.preview-iframe {
  flex: 1;
  width: 100%;
  border: none;
  background: white;
}

/* ===== 模板选择弹窗 ===== */
.templates-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}
.templates-overlay.active { display: flex; }
.templates-modal {
  background: var(--bg-secondary);
  border-radius: 16px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  overflow: hidden;
  box-shadow: var(--shadow-xl);
}
.templates-modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.templates-modal-title { font-size: 18px; font-weight: 600; }
.templates-close {
  width: 32px; height: 32px;
  border: none;
  background: var(--bg-tertiary);
  border-radius: 8px;
  cursor: pointer;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}
.templates-list {
  padding: 16px;
  overflow-y: auto;
  max-height: calc(80vh - 80px);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.template-card {
  padding: 16px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
}
.template-card:hover {
  border-color: var(--accent-primary);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.template-icon { font-size: 32px; margin-bottom: 8px; }
.template-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.template-desc { font-size: 12px; color: var(--text-muted); }

/* ===== 移动端适配 ===== */
@media (max-width: 1024px) {
  .main-layout { grid-template-columns: 260px 1fr 1fr; }
}

@media (max-width: 768px) {
  .nav-links { display: none; }
  .nav-toggle { display: flex; }
  .back-main { font-size: 11px; padding: 5px 10px; }
  .back-main i { display: none; }

  /* 移动端：编辑器和预览上下排列 */
  .main-layout {
    grid-template-columns: 1fr;
    grid-template-rows: 50% 50%;
    grid-template-areas: "editor" "preview";
    height: calc(100vh - 56px);
  }
  .main-layout .editor-panel { grid-area: editor; }
  .main-layout .preview-panel { grid-area: preview; }

  /* 课程面板变成抽屉 */
  .course-panel {
    position: fixed;
    top: 56px;
    left: -100%;
    width: 85%;
    max-width: 320px;
    height: calc(100vh - 56px);
    z-index: 900;
    transition: left 0.3s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,0.1);
  }
  .course-panel.open { left: 0; }

  .editor-panel { border-right: none; border-bottom: 1px solid var(--border-color); }

  /* 移动端按钮 */
  .mobile-toggle-btn {
    display: inline-flex !important;
  }

  /* 移动端编辑器最小化 */
  .editor-panel.minimized {
    grid-row: 2;
    height: 42px;
    min-height: 42px;
    overflow: hidden;
  }
  .editor-panel.minimized .editor-container,
  .editor-panel.minimized .editor-tabs {
    display: none;
  }
  .editor-panel.minimized .editor-toolbar {
    border-top: none;
    background: var(--bg-secondary);
  }
  .main-layout.preview-full {
    grid-template-rows: 42px 1fr;
    grid-template-areas: "editor" "preview";
  }

  /* 移动端预览最大化 */
  .preview-panel.fullscreen {
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 500;
  }

  /* 移动端编辑器全屏 */
  .editor-panel.fullscreen {
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 500;
    grid-area: auto !important;
  }

  /* 仅移动端显示的按钮 */
  .mobile-only {
    display: inline-flex !important;
  }

  /* 移动端模式按钮激活态 */
  .toolbar-btn.active {
    background: var(--accent-primary);
    color: white;
    border-color: var(--accent-primary);
  }
}

@media (max-width: 480px) {
  .nav-logo { font-size: 16px; }
  .editor-tab { padding: 8px 14px; font-size: 12px; }
  .toolbar-btn { padding: 5px 10px; font-size: 12px; }
  .templates-list { grid-template-columns: 1fr; }
}

/* 滚动条美化 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== AI 助手面板 ===== */
.ai-fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 1500;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--gradient-short);
  color: white;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
  transition: transform 0.2s, box-shadow 0.2s;
}
.ai-fab:hover {
  transform: scale(1.08);
  box-shadow: 0 10px 40px rgba(99, 102, 241, 0.5);
}
.ai-fab.active {
  transform: rotate(45deg);
}
.ai-fab-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #ef4444;
  color: white;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 10px;
  font-weight: 600;
}

.ai-panel {
  position: fixed;
  bottom: 90px;
  right: 24px;
  width: 380px;
  max-width: calc(100vw - 48px);
  height: 560px;
  max-height: calc(100vh - 140px);
  background: var(--bg-secondary);
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  display: none;
  flex-direction: column;
  z-index: 1400;
  overflow: hidden;
  border: 1px solid var(--border-color);
}
.ai-panel.active {
  display: flex;
}
.ai-panel-header {
  padding: 14px 18px;
  background: var(--gradient-short);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ai-panel-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ai-panel-close {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ai-panel-close:hover { background: rgba(255,255,255,0.3); }

.ai-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-tertiary);
}
.ai-tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.ai-tab:hover { color: var(--text-primary); }
.ai-tab.active {
  color: var(--accent-primary);
  border-bottom-color: var(--accent-primary);
  background: var(--bg-secondary);
}

.ai-tab-content {
  flex: 1;
  overflow: hidden;
  display: none;
  flex-direction: column;
}
.ai-tab-content.active { display: flex; }

.ai-chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ai-msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.ai-msg.user {
  background: var(--accent-primary);
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.ai-msg.ai {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  white-space: pre-wrap;
}
.ai-msg.loading {
  display: flex;
  gap: 4px;
  padding: 10px 14px;
}
.ai-msg.loading span {
  width: 8px;
  height: 8px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: aiBounce 1.4s infinite;
}
.ai-msg.loading span:nth-child(2) { animation-delay: 0.2s; }
.ai-msg.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes aiBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}
.ai-msg pre {
  background: var(--bg-code);
  color: #a5d6ff;
  padding: 10px;
  border-radius: 8px;
  margin: 8px 0 4px;
  overflow-x: auto;
  font-size: 12px;
  font-family: var(--font-mono);
}

.ai-chat-input {
  padding: 12px 14px;
  border-top: 1px solid var(--border-color);
  display: flex;
  gap: 8px;
  background: var(--bg-secondary);
}
.ai-chat-input textarea {
  flex: 1;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 8px 12px;
  resize: none;
  font-family: var(--font-body);
  font-size: 14px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  min-height: 38px;
  max-height: 80px;
  outline: none;
  line-height: 1.5;
}
.ai-chat-input textarea:focus { border-color: var(--accent-primary); }
.ai-chat-input button {
  background: var(--accent-primary);
  color: white;
  border: none;
  border-radius: 10px;
  width: 38px;
  height: 38px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.ai-chat-input button:hover { background: #4f46e5; }
.ai-chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

.ai-review-area, .ai-generate-area {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ai-review-area textarea, .ai-generate-area textarea {
  flex: 1;
  min-height: 120px;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  resize: vertical;
  outline: none;
  line-height: 1.5;
}
.ai-review-area textarea:focus, .ai-generate-area textarea:focus {
  border-color: var(--accent-primary);
}
.ai-action-row {
  display: flex;
  gap: 8px;
}
.ai-btn {
  flex: 1;
  padding: 10px 14px;
  background: var(--gradient-short);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;

.ai-btn.secondary {

.ai-result-box {

<script>
// ===== 模板数据 =====
const templates = [
  {
    name: '空白模板',
    icon: '📝',
    desc: '从零开始写',
    html: '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>我的页面</title>\n</head>\n<body>\n  <h1>Hello, World!</h1>\n  <p>开始你的编程之旅吧～</p>\n</body>\n</html>',
    css: 'body {\n  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;\n  max-width: 800px;\n  margin: 0 auto;\n  padding: 40px 20px;\n  color: #333;\n}\n\nh1 {\n  color: #6366f1;\n}',

  },
  {
    name: 'Hello World',
    icon: '👋',
    desc: '经典入门示例',
    html: '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>Hello World</title>\n</head>\n<body>\n  <div class="container">\n    <h1>Hello, World! 👋</h1>\n    <p>欢迎来到编程的世界！</p>\n    <button id="btn">点我试试看</button>\n    <p id="msg"></p>\n  </div>\n</body>\n</html>',
    css: 'body {\n  font-family: system-ui, sans-serif;\n  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n  min-height: 100vh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  margin: 0;\n}\n\n.container {\n  background: white;\n  padding: 40px 60px;\n  border-radius: 20px;\n  text-align: center;\n  box-shadow: 0 20px 60px rgba(0,0,0,0.3);\n}\n\nh1 {\n  color: #333;\n  margin: 0 0 10px;\n  font-size: 32px;\n}\n\np {\n  color: #666;\n  margin: 10px 0 20px;\n}\n\nbutton {\n  background: linear-gradient(135deg, #667eea, #764ba2);\n  color: white;\n  border: none;\n  padding: 12px 30px;\n  border-radius: 30px;\n  font-size: 16px;\n  cursor: pointer;\n  transition: transform 0.2s;\n}\n\nbutton:hover {\n  transform: scale(1.05);\n}\n\n#msg {\n  margin-top: 20px;\n  font-weight: bold;\n  color: #667eea;\n}',
    js: 'const btn = document.getElementById("btn");\nconst msg = document.getElementById("msg");\nlet count = 0;\n\nbtn.addEventListener("click", function() {\n  count++;\n  msg.textContent = "你点了 " + count + " 次！🎉";\n});'
  },
  {
    name: '待办清单',
    icon: '✅',
    desc: '简单的Todo应用',
    html: '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>待办清单</title>\n</head>\n<body>\n  <div class="app">\n    <h1>📝 待办清单</h1>\n    <div class="input-area">\n      <input type="text" id="todoInput" placeholder="添加新的待办事项...">\n      <button onclick="addTodo()">添加</button>\n    </div>\n    <ul id="todoList"></ul>\n  </div>\n</body>\n</html>',
    css: 'body {\n  font-family: system-ui, sans-serif;\n  background: #f0f4f8;\n  min-height: 100vh;\n  display: flex;\n  align-items: flex-start;\n  justify-content: center;\n  margin: 0;\n  padding: 40px 20px;\n}\n\n.app {\n  background: white;\n  border-radius: 16px;\n  padding: 30px;\n  width: 100%;\n  max-width: 500px;\n  box-shadow: 0 10px 40px rgba(0,0,0,0.1);\n}\n\nh1 {\n  text-align: center;\n  color: #333;\n  margin: 0 0 20px;\n}\n\n.input-area {\n  display: flex;\n  gap: 10px;\n  margin-bottom: 20px;\n}\n\ninput {\n  flex: 1;\n  padding: 12px 16px;\n  border: 2px solid #e2e8f0;\n  border-radius: 10px;\n  font-size: 16px;\n  outline: none;\n  transition: border-color 0.2s;\n}\n\ninput:focus {\n  border-color: #6366f1;\n}\n\nbutton {\n  padding: 12px 20px;\n  background: #6366f1;\n  color: white;\n  border: none;\n  border-radius: 10px;\n  font-size: 16px;\n  cursor: pointer;\n  transition: background 0.2s;\n}\n\nbutton:hover {\n  background: #4f46e5;\n}\n\nul {\n  list-style: none;\n  padding: 0;\n  margin: 0;\n}\n\nli {\n  display: flex;\n  align-items: center;\n  padding: 12px 16px;\n  background: #f8fafc;\n  border-radius: 10px;\n  margin-bottom: 8px;\n  gap: 10px;\n}\n\nli.done span {\n  text-decoration: line-through;\n  color: #94a3b8;\n}\n\nli span {\n  flex: 1;\n  color: #334155;\n}\n\n.delete-btn {\n  background: #ef4444;\n  padding: 6px 12px;\n  font-size: 14px;\n}\n\n.delete-btn:hover {\n  background: #dc2626;\n}',
    js: 'const todoInput = document.getElementById("todoInput");\nconst todoList = document.getElementById("todoList");\n\n// 从localStorage加载\nlet todos = JSON.parse(localStorage.getItem("todos") || "[]");\n\nfunction renderTodos() {\n  todoList.innerHTML = "";\n  todos.forEach((todo, index) => {\n    const li = document.createElement("li");\n    if (todo.done) li.classList.add("done");\n    li.innerHTML = `\n      <input type="checkbox" ${todo.done ? "checked" : ""} onchange="toggleTodo(${index})">\n      <span>${todo.text}</span>\n      <button class="delete-btn" onclick="deleteTodo(${index})">删除</button>\n    `;\n    todoList.appendChild(li);\n  });\n  saveTodos();\n}\n\nfunction addTodo() {\n  const text = todoInput.value.trim();\n  if (!text) return;\n  todos.push({ text: text, done: false });\n  todoInput.value = "";\n  renderTodos();\n}\n\nfunction toggleTodo(index) {\n  todos[index].done = !todos[index].done;\n  renderTodos();\n}\n\nfunction deleteTodo(index) {\n  todos.splice(index, 1);\n  renderTodos();\n}\n\nfunction saveTodos() {\n  localStorage.setItem("todos", JSON.stringify(todos));\n}\n\n// 回车添加\ntodoInput.addEventListener("keypress", function(e) {\n  if (e.key === "Enter") addTodo();\n});\n\n// 初始渲染\nrenderTodos();'
  },
  {
    name: '计算器',
    icon: '🧮',
    desc: '简易计算器',
    html: '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n  <meta charset="UTF-8">\n  <title>计算器</title>\n</head>\n<body>\n  <div class="calculator">\n    <div class="display" id="display">0</div>\n    <div class="keys">\n      <button class="btn func" onclick="clearAll()">C</button>\n      <button class="btn func" onclick="backspace()">⌫</button>\n      <button class="btn func" onclick="appendOp(\'%\')">%</button>\n      <button class="btn op" onclick="appendOp(\'/\')">÷</button>\n      <button class="btn num" onclick="appendNum(\'7\')">7</button>\n      <button class="btn num" onclick="appendNum(\'8\')">8</button>\n      <button class="btn num" onclick="appendNum(\'9\')">9</button>\n      <button class="btn op" onclick="appendOp(\'*\')">×</button>\n      <button class="btn num" onclick="appendNum(\'4\')">4</button>\n      <button class="btn num" onclick="appendNum(\'5\')">5</button>\n      <button class="btn num" onclick="appendNum(\'6\')">6</button>\n      <button class="btn op" onclick="appendOp(\'-\')">−</button>\n      <button class="btn num" onclick="appendNum(\'1\')">1</button>\n      <button class="btn num" onclick="appendNum(\'2\')">2</button>\n      <button class="btn num" onclick="appendNum(\'3\')">3</button>\n      <button class="btn op" onclick="appendOp(\'+\')">+</button>\n      <button class="btn num zero" onclick="appendNum(\'0\')">0</button>\n      <button class="btn num" onclick="appendNum(\'.\')">.</button>\n      <button class="btn equals" onclick="calculate()">=</button>\n    </div>\n  </div>\n</body>\n</html>',
    css: 'body {\n  font-family: system-ui, sans-serif;\n  background: linear-gradient(135deg, #1a1a2e, #16213e);\n  min-height: 100vh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  margin: 0;\n}\n\n.calculator {\n  background: #0f0f23;\n  border-radius: 20px;\n  padding: 24px;\n  box-shadow: 0 20px 60px rgba(0,0,0,0.5);\n  width: 320px;\n}\n\n.display {\n  background: #1a1a2e;\n  color: white;\n  font-size: 48px;\n  font-weight: 300;\n  text-align: right;\n  padding: 20px 16px;\n  border-radius: 12px;\n  margin-bottom: 16px;\n  font-family: "SF Mono", monospace;\n  overflow-x: auto;\n  min-height: 80px;\n  display: flex;\n  align-items: center;\n  justify-content: flex-end;\n}\n\n.keys {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 10px;\n}\n\n.btn {\n  aspect-ratio: 1;\n  border: none;\n  border-radius: 50%;\n  font-size: 22px;\n  cursor: pointer;\n  transition: all 0.15s;\n  font-weight: 500;\n}\n\n.btn:active { transform: scale(0.95); }\n\n.num { background: #333; color: white; }\n.num:hover { background: #444; }\n\n.func { background: #a5a5a5; color: black; }\n.func:hover { background: #b5b5b5; }\n\n.op { background: #ff9500; color: white; }\n.op:hover { background: #ffaa33; }\n\n.equals { background: #ff9500; color: white; }\n.equals:hover { background: #ffaa33; }\n\n.zero {\n  grid-column: span 2;\n  border-radius: 40px;\n  aspect-ratio: auto;\n  text-align: left;\n  padding-left: 28px;\n}',
    js: 'let display = document.getElementById("display");\nlet current = "0";\nlet previous = null;\nlet operator = null;\nlet justCalculated = false;\n\nfunction updateDisplay() {\n  display.textContent = current;\n}\n\nfunction appendNum(num) {\n  if (justCalculated) {\n    current = num;\n    justCalculated = false;\n  } else {\n    if (current === "0" && num !== ".") {\n      current = num;\n    } else if (num === "." && current.includes(".")) {\n      return;\n    } else {\n      current += num;\n    }\n  }\n  updateDisplay();\n}\n\nfunction appendOp(op) {\n  if (op === "%") {\n    current = String(parseFloat(current) / 100);\n    updateDisplay();\n    return;\n  }\n  if (previous !== null && !justCalculated) {\n    calculate();\n  }\n  previous = parseFloat(current);\n  operator = op;\n  justCalculated = true;\n}\n\nfunction calculate() {\n  if (previous === null || operator === null) return;\n  let result;\n  const curr = parseFloat(current);\n  switch (operator) {\n    case "+": result = previous + curr; break;\n    case "-": result = previous - curr; break;\n    case "*": result = previous * curr; break;\n    case "/": result = curr !== 0 ? previous / curr : "Error"; break;\n    default: return;\n  }\n  current = String(result);\n  previous = null;\n  operator = null;\n  justCalculated = true;\n  updateDisplay();\n}\n\nfunction clearAll() {\n  current = "0";\n  previous = null;\n  operator = null;\n  justCalculated = false;\n  updateDisplay();\n}\n\nfunction backspace() {\n  if (current.length > 1) {\n    current = current.slice(0, -1);\n  } else {\n    current = "0";\n  }\n  updateDisplay();\n}\n\n// 键盘支持\ndocument.addEventListener("keydown", function(e) {\n  if (/[0-9.]/.test(e.key)) appendNum(e.key);\n  else if (/[+\\-*/]/.test(e.key)) appendOp(e.key);\n  else if (e.key === "Enter" || e.key === "=") calculate();\n  else if (e.key === "Escape") clearAll();\n  else if (e.key === "Backspace") backspace();\n});'
  },
  {
    name: '渐变背景',

// ===== 状态 =====
let currentTab = 'html';
let autoRun = true;

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  lucide.createIcons();
  renderTemplates();
  
  // 加载默认模板
  loadTemplate(0);
  
  // URL参数加载课程
  loadFromURL();
  
  // Tab键缩进
  ['htmlEditor', 'cssEditor', 'jsEditor'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 2;
      }
    });
    el.addEventListener('input', function() {
      if (autoRun) {
        clearTimeout(window._runTimer);
        window._runTimer = setTimeout(runCode, 500);
      }
    });
  });

  // AI 快捷键：Ctrl+Shift+A 打开AI面板
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
      e.preventDefault();
      toggleAiPanel();
    }
  });

  // 移动端默认收起编辑器，预览占满（用户点击按钮展开编辑）
  if (window.innerWidth <= 768) {
    setTimeout(() => {
      applyEditorMode();
    }, 50);
  }
});

function initTheme() {
  const saved = localStorage.getItem('playground-theme');
  if (saved === 'dark') {
    document.body.classList.add('dark-mode');
    updateThemeIcon(true);
  }
  document.getElementById('themeToggle').addEventListener('click', function() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('playground-theme', isDark ? 'dark' : 'light');
    updateThemeIcon(isDark);
  });
}
function updateThemeIcon(dark) {

}

function runCode() {
  const html = document.getElementById('htmlEditor').value;
  const css = document.getElementById('cssEditor').value;
  const js = document.getElementById('jsEditor').value;
  
  const fullHtml = html.replace('</head>', `<style>${css}</style></head>`)
    .replace('</body>', `<script>${js}<\/script></body>`);
  
  const iframe = document.getElementById('previewFrame');
  iframe.srcdoc = fullHtml;
}

// ===== 移动端预览控制 =====
let editorMode = 'preview'; // 'preview' | 'split' | 'editor'
let previewFullscreen = false;

function applyEditorMode() {
  const editorPanel = document.querySelector('.editor-panel');
  const previewPanel = document.querySelector('.preview-panel');
  const mainLayout = document.querySelector('.main-layout');
  if (!editorPanel || !previewPanel || !mainLayout) return;

  // 清除所有状态
  editorPanel.classList.remove('minimized', 'fullscreen');
  previewPanel.classList.remove('fullscreen');
  mainLayout.classList.remove('preview-full');

  // 更新按钮激活态
  const btns = {
    preview: document.getElementById('mobilePreviewOnlyBtn'),
    split: document.getElementById('mobileSplitBtn'),
    editor: document.getElementById('mobileEditorFullBtn')
  };
  Object.keys(btns).forEach(k => {
    if (btns[k]) {
      btns[k].classList.toggle('active', k === editorMode);
    }
  });

  if (editorMode === 'preview') {
    // 收起编辑器（只留 42px 工具条）
    editorPanel.classList.add('minimized');
    mainLayout.classList.add('preview-full');
  } else if (editorMode === 'editor') {
    // 全屏编辑器
    editorPanel.classList.add('fullscreen');
  }
  // split 模式：保持 grid 上下 50/50
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function toggleEditorMinimize() {
  if (editorMode === 'preview') {
    editorMode = 'editor';
  } else {
    editorMode = 'preview';
  }
  applyEditorMode();
}

function setEditorMode(mode) {
  editorMode = mode;
  applyEditorMode();
}

function togglePreviewFullscreen() {
  const previewPanel = document.querySelector('.preview-panel');
  const btnIcon = document.querySelector('#mobileFullscreenBtn i');
  previewFullscreen = !previewFullscreen;
  if (previewFullscreen) {
    previewPanel.classList.add('fullscreen');

      btnIcon.setAttribute('data-lucide', 'minimize-2');

      btnIcon.setAttribute('data-lucide', 'maximize-2');
      lucide.createIcons();
    }
  }
}

// 课程ID到数据文件的映射
const courseFileMap = {
  'html': 'html-course.json',
  'python': 'python-course.json',
  'js': 'js-course.json',
  'ai': 'ai-course.json',
  'python-intermediate': 'python-intermediate.json',

// ===== 从localStorage或URL加载课程 =====
function loadFromURL() {
  // 优先从localStorage加载（更可靠）
  try {
    const saved = localStorage.getItem('playgroundData');
    if (saved) {
      const data = JSON.parse(saved);
      renderCourseData(data);
      return;
    }
  } catch(e) {}
  
  // 备用：从URL参数加载（需要fetch）
  loadFromURLFetch();
}

function renderCourseData(data) {
  let html = `<h3>${data.chapterTitle || '课程内容'}</h3>`;
  
  if (data.introduction) {
    html += `<p>${data.introduction}</p>`;
  }
  
  if (data.sectionTitle) {
    html += `<p><strong>${data.sectionTitle}</strong></p>`;
  }
  
  if (data.sectionContent) {
    html += `<p>${data.sectionContent}</p>`;
  }
  
  if (data.code) {
    html += `
      <div class="code-block">
        <div class="code-header">
          <span class="code-lang">${data.language || 'code'}</span>
          <button class="code-load-btn" id="loadCodeBtn">加载到编辑器</button>
        </div>
        <pre><code>${escapeHtml(data.code)}</code></pre>
      </div>
    `;
  }
  
  document.getElementById('courseContent').innerHTML = html;
  
  if (data.code) {
    const btn = document.getElementById('loadCodeBtn');
    if (btn) {
      btn.addEventListener('click', function() {
        loadCodeToEditor(data.code, data.language);
      });
    }
    
    // 自动加载代码到编辑器
    setTimeout(() => loadCodeToEditor(data.code, data.language), 300);
  }
}

// 备用：从URL参数fetch加载
async function loadFromURLFetch() {
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('course');
  const chapter = parseInt(params.get('chapter') || '1') - 1;
  const sectionIdx = parseInt(params.get('section') || '0');
  
  if (!courseId) return;
  
  const dataFile = courseFileMap[courseId];
  if (!dataFile) return;
  
  try {
    const res = await fetch(`data/${dataFile}`);
    const data = await res.json();
    if (!data.chapters || !data.chapters[chapter]) return;
    
    const ch = data.chapters[chapter];
    const content = ch.content;
    
    let codeSection = null;
    let codeSectionIndex = 0;
    
    if (content.sections && content.sections.length) {
      const sec = content.sections[sectionIdx] || content.sections[0];
      if (sec.type === 'code' || sec.code) {
        codeSection = sec;
      }
      
      if (!codeSection) {
        for (let i = 0; i < content.sections.length; i++) {
          if (content.sections[i].type === 'code' || content.sections[i].code) {
            codeSection = content.sections[i];
            codeSectionIndex = i;
            break;
          }
        }
      }
    }
    
    if (codeSection) {
      const courseData = {
        courseId: courseId,
        chapterTitle: ch.title,
        sectionTitle: codeSection.title,
        introduction: content.introduction || '',
        sectionContent: codeSection.content || '',
        code: codeSection.code || '',
        language: codeSection.language || 'html'
      };
      renderCourseData(courseData);
    }
  } catch (e) {
    console.error('加载课程失败:', e);
  }
}

function loadCodeToEditor(code, language) {
  const lang = (language || '').toLowerCase();
  const htmlEd = document.getElementById('htmlEditor');
  const cssEd = document.getElementById('cssEditor');
  const jsEd = document.getElementById('jsEditor');
  
  const baseHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预览</title>
</head>
<body>
  <h1>Hello</h1>
  <p>在这里预览你的代码效果</p>
</body>
</html>`;
  
  let targetTab = 'html';
  
  // 先按指定语言判断
  if (lang === 'html') {
    htmlEd.value = code;
    cssEd.value = '';
    jsEd.value = '';
    targetTab = 'html';
  } else if (lang === 'css') {
    if (!htmlEd.value || !htmlEd.value.includes('<body')) {
      htmlEd.value = baseHtml;
    }
    cssEd.value = code;
    targetTab = 'css';
  } else if (lang === 'javascript' || lang === 'js') {
    if (!htmlEd.value || !htmlEd.value.includes('<body')) {
      htmlEd.value = baseHtml;
    }
    jsEd.value = code;
    targetTab = 'js';
  } else if (code.includes('<!DOCTYPE html>') || code.includes('<html')) {
    htmlEd.value = code;
    cssEd.value = '';
    jsEd.value = '';
    targetTab = 'html';
  } else if (code.trim().startsWith('.') || code.trim().startsWith('#') || (code.includes('{') && code.includes('}') && !code.includes('function') && !code.includes('var ') && !code.includes('let '))) {
    if (!htmlEd.value || !htmlEd.value.includes('<body')) {
      htmlEd.value = baseHtml;
    }
    cssEd.value = code;
    targetTab = 'css';
  } else {
    if (!htmlEd.value || !htmlEd.value.includes('<body')) {
      htmlEd.value = baseHtml;
    }
    jsEd.value = code;
    targetTab = 'js';
  }
  
  switchTab(targetTab);
  runCode();
  
  // 移动端提示
  if (window.innerWidth <= 768) {
    toggleCoursePanel();
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

      },
      body: JSON.stringify({
        model: AI_MODEL,
        messages: messages,
        temperature: 0.7,
        max_tokens: 2000
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.choices && data.choices[0]) {
      return { content: data.choices[0].message.content, error: false };
    }
    return { content: 'AI 响应异常', error: true };
  } catch (e) {
    return { content: '⚠️ AI 服务暂时不可用，请稍后再试。错误: ' + e.message, error: true };
  }
}

async function aiSendChat() {
  const input = document.getElementById('aiChatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  aiAddMessage('user', text);
  aiChatHistory.push({ role: 'user', content: text });
  aiShowLoading();

  const result = await aiCallAPI(aiChatHistory);
  aiRemoveLoading();
  aiAddMessage('ai', result.content);
  if (!result.error) {
    aiChatHistory.push({ role: 'assistant', content: result.content });
  }
}

function aiSendPreset(text) {
  const input = document.getElementById('aiChatInput');
  input.value = text;
  aiSendChat();
}

function handleAiChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    aiSendChat();
  }
}

function aiLoadCurrentCode() {
  const html = document.getElementById('htmlEditor').value;
  const css = document.getElementById('cssEditor').value;
  const js = document.getElementById('jsEditor').value;
  const fullCode = `// HTML\n${html}\n\n// CSS\n${css}\n\n// JavaScript\n${js}`;
  document.getElementById('aiReviewCode').value = fullCode;
}

async function aiReviewCodeAction() {
  const code = document.getElementById('aiReviewCode').value.trim();
  const resultBox = document.getElementById('aiReviewResult');
  const applyBtn = document.getElementById('aiApplyReviewBtn');
  if (!code) {
    resultBox.textContent = '请先粘贴要监修的代码';
    return;
  }
  resultBox.classList.remove('ready');
  resultBox.classList.add('loading');
  resultBox.textContent = '';
  applyBtn.style.display = 'none';

  const messages = [
    { role: 'system', content: '你是一位资深代码审查专家。请审查以下代码，找出潜在问题、bug、性能问题和改进建议。用中文回答，格式包括：问题分析、修复建议、优化建议。如果代码没问题也要说明。' },
    { role: 'user', content: '请审查以下代码：\n\n```\n' + code + '\n```' }
  ];

  const result = await aiCallAPI(messages);
  resultBox.classList.remove('loading');
  resultBox.classList.add('ready');
  resultBox.textContent = result.content;
  if (!result.error) {
    try {
      const codeBlocks = result.content.match(/```[\s\S]*?```/g);
      if (codeBlocks && codeBlocks.length > 0) {
        applyBtn.style.display = 'flex';
      }
    } catch(e) {}
  }
}

function aiApplyReview() {
  const resultBox = document.getElementById('aiReviewResult');
  const text = resultBox.textContent;
  const codeBlocks = text.match(/```(?:\w*)?\n([\s\S]*?)```/g);
  if (!codeBlocks || codeBlocks.length === 0) {
    alert('没有可应用的代码建议');
    return;
  }
  const htmlEd = document.getElementById('htmlEditor');
  const cssEd = document.getElementById('cssEditor');
  const jsEd = document.getElementById('jsEditor');
  for (const block of codeBlocks) {
    const lang = block.match(/```(\w*)/);
    const code = block.replace(/```\w*\n/, '').replace(/```$/, '').trim();
    const langStr = lang ? lang[1].toLowerCase() : '';
    if (langStr === 'html' || (code.includes('<html') || code.includes('<!DOCTYPE'))) {
      htmlEd.value = code;
    } else if (langStr === 'css' || (code.includes('{') && code.includes('}') && !code.includes('function'))) {
      cssEd.value = code;
    } else if (langStr === 'javascript' || langStr === 'js') {
      jsEd.value = code;
    }
  }
  runCode();
  alert('已将建议代码填入编辑器！');
}

async function aiGenerateCode() {
  const prompt = document.getElementById('aiGeneratePrompt').value.trim();
  const resultBox = document.getElementById('aiGenerateResult');
  const applyBtn = document.getElementById('aiGenerateResult').parentElement.querySelector('.ai-btn.secondary');
  if (!prompt) {
    resultBox.textContent = '请先描述你想实现的功能';
    return;
  }
  resultBox.classList.remove('ready');
  resultBox.classList.add('loading');
  resultBox.textContent = '';
  applyBtn.style.display = 'none';

  const messages = [
    { role: 'system', content: '你是一位专业的Web开发工程师。根据用户需求生成完整的HTML/CSS/JavaScript代码。请分别用 ```html ```css ```javascript 标签包裹各部分代码。确保代码完整可直接运行。用中文简短说明实现思路。' },
    { role: 'user', content: '请帮我实现：' + prompt }
  ];

  const result = await aiCallAPI(messages);
  resultBox.classList.remove('loading');
  resultBox.classList.add('ready');
  resultBox.textContent = result.content;
  if (!result.error) {
    applyBtn.style.display = 'flex';
  }
}

function aiApplyGenerated() {
  const resultBox = document.getElementById('aiGenerateResult');
  const text = resultBox.textContent;
  const htmlMatch = text.match(/```html\n([\s\S]*?)```/);
  const cssMatch = text.match(/```css\n([\s\S]*?)```/);
  const jsMatch = text.match(/```javascript\n([\s\S]*?)```/) || text.match(/```js\n([\s\S]*?)```/);

  if (htmlMatch) document.getElementById('htmlEditor').value = htmlMatch[1].trim();
  if (cssMatch) document.getElementById('cssEditor').value = cssMatch[1].trim();
  if (jsMatch) document.getElementById('jsEditor').value = jsMatch[1].trim();
  if (!htmlMatch && !cssMatch && !jsMatch) {
    alert('未能解析出代码块，请手动复制');
    return;
  }
  runCode();
  alert('代码已填入编辑器，点击运行即可预览！');
}
